<app-header />

<main class="dashboard">
  <h1>{{ pageTitle }}</h1>
  <p>Controlla lo stato delle tue attività.</p>

  <!-- Entrambi i figli ricevono gli stessi dati. -->
  <app-task-summary [tasks]="taskStore.tasks()" />

  <section class="dashboard__progress" aria-labelledby="progress-title">
    <h2 id="progress-title">Avanzamento complessivo</h2>

    <label for="task-progress">
      Attività completate:
      {{ taskStore.completionPercentage() }}%
    </label>

    <!-- progress è un elemento semantico accessibile. -->
    <progress id="task-progress" max="100" [value]="taskStore.completionPercentage()"></progress>
  </section>

  <div class="dashboard__actions">
    <button type="button" (click)="taskStore.addDemoTask()">Aggiungi attività dimostrativa</button>

    <button type="button" (click)="taskStore.resetTasks()">Ripristina attività</button>
  </div>

  <!-- $event contiene l'ID emesso da TaskList. -->
  <app-task-list
    (taskStarted)="taskStore.startTask($event)"
    [tasks]="taskStore.tasks()"
    (taskCompleted)="taskStore.completeTask($event)"
    (taskRemoved)="taskStore.removeTask($event)"
  />
</main>
